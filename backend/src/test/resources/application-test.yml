spring:
  datasource:
    url: jdbc:h2:mem:shop_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  data:
    redis:
      repositories:
        enabled: false
  flyway:
    enabled: false # Disable Flyway in test to speed up and avoid PG-specific migration scripts incompatibility

jwt:
  secret: devsecretkeydevsecretkeydevsecretkeydevsecretkeydevsecretkey
  expiration: 604800
