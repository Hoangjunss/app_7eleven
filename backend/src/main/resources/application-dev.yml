spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seven_eleven}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:seven_eleven_redis_pass_dev}

jwt:
  secret: ${JWT_SECRET:devsecretkeydevsecretkeydevsecretkeydevsecretkeydevsecretkey}
  expiration: 604800 # 7 days in seconds

logging:
  level:
    root: INFO
    com._eleven.shop: DEBUG
