spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres-db}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:redis-cache}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  expiration: 604800 # 7 days in seconds

logging:
  level:
    root: WARN
    com._eleven.shop: INFO

cors:
  allowed:
    origins: ${CORS_ALLOWED_ORIGINS:https://test7eleven.online,https://admin.test7eleven.online,http://localhost:3000,http://103.72.99.211:3000}
