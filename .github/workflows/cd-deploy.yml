name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test Backend (Maven)
        run: |
          cd backend
          mvn clean test -DskipTests=false

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Build Frontend (Next.js)
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
        run: |
          cd frontend
          npm run build

  deploy:
    name: Deploy to Production VPS
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: SSH_HOST
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SSH and Deploy via Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Hàm phụ trợ ghi log kèm timestamp
            log() {
              echo "[$(date +'%Y-%m-%d %H:%M:%S')] $1"
            }

            log "======================================================"
            log "       BẮT ĐẦU QUY TRÌNH TRIỂN KHAI TRÊN VPS          "
            log "======================================================"

            # In thông tin chẩn đoán lỗi (Debug/Diagnostics)
            log "[DEBUG] Thư mục hiện tại: $(pwd)"
            log "[DEBUG] User thực thi: $(whoami)"

            # 1. Kiểm tra & cài đặt Docker + Docker Compose nếu chưa có
            log "[1/7] Kiểm tra Docker & Docker Compose..."
            if ! command -v docker &> /dev/null; then
              log "[SYSTEM] Docker chưa được cài đặt. Tiến hành cài đặt..."
              curl -fsSL https://get.docker.com -o get-docker.sh
              if ! sh get-docker.sh; then
                log "[ERROR] Cài đặt Docker thất bại!"
                exit 1
              fi
              rm get-docker.sh
              log "[SYSTEM] Cài đặt Docker thành công."
            fi
            log "[DEBUG] Docker Version: $(docker --version)"

            if ! docker compose version &> /dev/null; then
              log "[SYSTEM] Docker Compose v2 chưa được cài đặt. Tiến hành cài đặt..."
              mkdir -p /usr/local/lib/docker/cli-plugins
              if ! curl -SL https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose; then
                log "[ERROR] Tải Docker Compose binary thất bại!"
                exit 1
              fi
              chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
              log "[SYSTEM] Cài đặt Docker Compose v2 thành công."
            fi
            log "[DEBUG] Docker Compose Version: $(docker compose version)"

            # 2. Kiểm tra & cài đặt Git nếu chưa có
            log "[2/7] Kiểm tra Git..."
            if ! command -v git &> /dev/null; then
              log "[SYSTEM] Git chưa được cài đặt. Tiến hành cài đặt..."
              if ! (apt-get update && apt-get install -y git); then
                log "[ERROR] Cài đặt Git thông qua apt thất bại!"
                exit 1
              fi
              log "[SYSTEM] Cài đặt Git thành công."
            fi
            log "[DEBUG] Git Version: $(git --version)"

            # 3. Quản lý thư mục Deploy và Repo Clone/Pull
            log "[3/7] Quản lý thư mục Deploy và Repo..."
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            log "[DEBUG] Thư mục deploy cấu hình: $DEPLOY_PATH"
            
            mkdir -p $(dirname "$DEPLOY_PATH")
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              log "[REPO] Chưa tìm thấy Git Repository. Tiến hành clone lần đầu..."
              if ! git clone https://github.com/Hoangjunss/app_7eleven.git "$DEPLOY_PATH"; then
                log "[ERROR] Clone repository từ GitHub thất bại!"
                exit 1
              fi
              cd "$DEPLOY_PATH"
            else
              log "[REPO] Đã tìm thấy thư mục Repository. Di chuyển vào thư mục..."
              cd "$DEPLOY_PATH"
              log "[DEBUG] Danh sách tệp tin hiện tại:"
              ls -la
              
              log "[REPO] Dọn dẹp/Stash mọi thay đổi tạm thời nếu có..."
              git stash
              log "[REPO] Đồng bộ và reset cứng về origin/main..."
              git fetch --all
              if ! git reset --hard origin/main; then
                log "[ERROR] Đồng bộ git reset --hard origin/main thất bại!"
                exit 1
              fi
            fi
            log "[DEBUG] Trạng thái Git sau đồng bộ:"
            git status

            # 4. Tạo lại file biến môi trường .env.prod bảo mật
            log "[4/7] Khởi tạo file biến môi trường .env.prod..."
            if ! echo "${{ secrets.ENV_PROD_CONTENT }}" > .env.prod; then
              log "[ERROR] Ghi file cấu hình .env.prod thất bại!"
              exit 1
            fi
            log "[SUCCESS] Ghi cấu hình .env.prod thành công."

            # 5. Khởi chạy container từ image mới
            log "[5/7] Khởi chạy container từ image mới..."
            log "[DOCKER] Tiến hành hạ các container cũ..."
            if ! docker compose -f docker-compose.yml --env-file .env.prod down --remove-orphans; then
              log "[WARNING] Lỗi xảy ra khi hạ container cũ, vẫn tiếp tục..."
            fi
            
            # Thử kéo image từ GHCR (Thử tối đa 3 lần đề phòng lỗi mạng)
            log "[DOCKER] Bắt đầu tải các Docker Images mới nhất từ GHCR..."
            ATTEMPTS=1
            MAX_ATTEMPTS=3
            PULL_SUCCESS=false
            
            while [ $ATTEMPTS -le $MAX_ATTEMPTS ]; do
              log "[DOCKER] Thử kéo image lần thứ $ATTEMPTS/$MAX_ATTEMPTS..."
              if docker compose -f docker-compose.yml --env-file .env.prod pull; then
                PULL_SUCCESS=true
                log "[SUCCESS] Tải thành công toàn bộ image từ GHCR!"
                break
              else
                log "[WARNING] Tải image lần thứ $ATTEMPTS thất bại. Thử lại sau 5 giây..."
                sleep 5
                ATTEMPTS=$((ATTEMPTS + 1))
              fi
            done

            if [ "$PULL_SUCCESS" = "false" ]; then
              log "[ERROR] Triển khai thất bại: Không thể tải image từ GHCR sau $MAX_ATTEMPTS lần thử."
              exit 1
            fi

            log "[DOCKER] Khởi chạy các container ở chế độ chạy ngầm (detached)..."
            if ! docker compose -f docker-compose.yml --env-file .env.prod up -d --remove-orphans; then
              log "[ERROR] Khởi chạy container bằng docker compose up thất bại!"
              log "[DEBUG] Danh sách trạng thái container hiện tại:"
              docker ps -a
              log "[DEBUG] In logs lỗi của docker compose:"
              docker compose -f docker-compose.yml --env-file .env.prod logs --tail 100
              exit 1
            fi
            log "[SUCCESS] Các container đã khởi chạy thành công."

            # 6. Kiểm tra trạng thái sức khỏe (Healthcheck) chi tiết (Vòng lặp tối đa 12 lần mỗi 5 giây = 60s)
            log "[6/7] Bắt đầu quy trình kiểm tra sức khỏe các dịch vụ..."
            
            CHECK_INTERVAL=5
            MAX_CHECKS=12
            COUNT=1
            ALL_HEALTHY=false

            while [ $COUNT -le $MAX_CHECKS ]; do
              log "Kiểm tra sức khỏe lần thứ $COUNT/$MAX_CHECKS..."
              
              log "Trạng thái container hiện tại:"
              docker ps --format "table {{.Names}}\t{{.Status}}"
              
              # Đếm số lượng container có trạng thái healthy
              HEALTHY_COUNT=$(docker ps --filter "health=healthy" | wc -l)
              HEALTHY_COUNT=$((HEALTHY_COUNT - 1)) # Loại bỏ dòng header của docker ps
              
              log "Đang có $HEALTHY_COUNT / 4 container khỏe mạnh (healthy)."
              
              if [ "$HEALTHY_COUNT" -eq 4 ]; then
                ALL_HEALTHY=true
                log "[SUCCESS] Toàn bộ 4 dịch vụ (Postgres, Redis, Backend, Frontend) đều HEALTHY!"
                break
              fi
              
              log "Một số dịch vụ đang khởi động hoặc chưa ổn định. Chờ tiếp $CHECK_INTERVAL giây..."
              sleep $CHECK_INTERVAL
              COUNT=$((COUNT + 1))
            done

            if [ "$ALL_HEALTHY" = "false" ]; then
              log "[ERROR] Triển khai thất bại: Quá thời gian chờ (60s) nhưng các dịch vụ vẫn chưa HEALTHY!"
              log "[DEBUG] Danh sách toàn bộ container:"
              docker ps -a
              
              # Duyệt tìm container không healthy và in log chẩn đoán lỗi
              log "[DEBUG] Quét logs các container gặp lỗi..."
              for container in shop-postgres shop-redis shop-backend shop-frontend; do
                STATUS=$(docker inspect --format='{{json .State.Health.Status}}' $container 2>/dev/null || echo "unknown")
                log "Dịch vụ '$container' có trạng thái sức khỏe: $STATUS"
                if [ "$STATUS" != "\"healthy\"" ]; then
                  log "========================================="
                  log "    IN 50 DÒNG LOGS CUỐI CỦA CONTAINER: $container"
                  log "========================================="
                  docker logs --tail 50 $container
                fi
              done
              exit 1
            fi

            # 7. Giải phóng dung lượng ổ đĩa (Dọn dẹp cache Docker build thừa)
            log "[7/7] Giải phóng dung lượng đĩa và dọn dẹp cache Docker..."
            if docker builder prune -f --filter "until=24h" && docker image prune -f; then
              log "[SUCCESS] Giải phóng dung lượng đĩa hoàn tất."
            else
              log "[WARNING] Lỗi xảy ra khi dọn dẹp Docker cache."
            fi

            log "======================================================"
            log "    QUY TRÌNH TRIỂN KHAI TRIỂN KHAI HOÀN TẤT TỐT ĐẸP "
            log "======================================================"

